schema_version: "1.1"
name: captions-trigger-dutch-captions
description: Should trigger captions.
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "ik wil Nederlandse ondertiteling in mijn video, kun je die erin branden? video.mp4"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?captions"'
