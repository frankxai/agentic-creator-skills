schema_version: "1.1"
name: captions-no-trigger-blog-summary
description: "Should NOT trigger captions."
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "summarise this blog post into five bullet points"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?captions"'
    min: 0
    max: 0
