schema_version: "1.1"
name: shorts-no-trigger-content-calendar
description: "Should NOT trigger shorts-from-long."
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "plan a 30 day content calendar for my small bakery's Instagram"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shorts-from-long"'
    min: 0
    max: 0
