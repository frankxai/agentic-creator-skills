schema_version: "1.1"
name: video-trigger-cut-pauses
description: Should trigger video-edit.
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "can you cut out all the pauses and ums in my vlog? it's at C:/Users/me/Videos/morning-vlog.mp4"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?video-edit"'
