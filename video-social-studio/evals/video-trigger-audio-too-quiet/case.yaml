schema_version: "1.1"
name: video-trigger-audio-too-quiet
description: Should trigger video-edit.
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "my voice is way too quiet in this video compared to other reels, can you fix the sound? talk.mp4"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?video-edit"'
