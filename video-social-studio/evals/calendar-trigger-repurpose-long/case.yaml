schema_version: "1.1"
name: calendar-trigger-repurpose-long
description: "Should trigger content-calendar."
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "how do I get more out of my 25 minute video? I want a posting schedule for instagram and tiktok"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?content-calendar"'
