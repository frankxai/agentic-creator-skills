schema_version: "1.1"
name: shorts-trigger-podcast-to-reels
description: Should trigger shorts-from-long.
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "I have a 58 minute podcast episode, can you turn it into a few Reels? episode12.mp4"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?shorts-from-long"'
