schema_version: "1.1"
name: video-no-trigger-write-caption-text
description: "Should NOT trigger video-edit."
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "write me an instagram caption with hashtags for my new pasta recipe post"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?video-edit"'
    min: 0
    max: 0
