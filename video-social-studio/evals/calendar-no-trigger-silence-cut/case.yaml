schema_version: "1.1"
name: calendar-no-trigger-silence-cut
description: "Should NOT trigger content-calendar. (belongs to another skill)"
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "remove the silences from my long video and export it for youtube"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?content-calendar"'
    min: 0
    max: 0
