schema_version: "1.1"
name: calendar-trigger-plan-week
description: "Should trigger content-calendar."
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "plan my week of posts from my new youtube video on budget travel in Portugal"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?content-calendar"'
