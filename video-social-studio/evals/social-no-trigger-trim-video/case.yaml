schema_version: "1.1"
name: social-no-trigger-trim-video
description: "Should NOT trigger social-post-kit. (belongs to another skill)"
tags: [trigger, should-not-trigger]
runs: 1
execution:
  prompt: "cut the first 12 seconds off interview.mp4 and remove the long pauses"
  max_turns: 4
  allowed_tools: [Skill, Read]
graders:
  - name: skill-not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?social-post-kit"'
    min: 0
    max: 0
