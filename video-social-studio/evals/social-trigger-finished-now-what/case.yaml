schema_version: "1.1"
name: social-trigger-finished-now-what
description: "Should trigger social-post-kit."
tags: [trigger, should-trigger]
runs: 1
execution:
  prompt: "ok my video is exported and done. now what do I actually write when I post it?"
  max_turns: 6
  allowed_tools: [Skill, Read]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?social-post-kit"'
